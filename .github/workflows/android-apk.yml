# Builds an installable Android APK on demand (Actions tab, "Run workflow"), so unfinished work does not trigger builds.
# Each build is published as a GitHub Release, so it can be downloaded straight from the phone.
name: Android APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: android
      - run: cp android/app/build/outputs/apk/release/app-release.apk TheSystem.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: The System (build ${{ github.run_number }})
          body: Android test build. On your phone, download TheSystem.apk and open it to install.
          files: TheSystem.apk
          make_latest: true
